<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conteúdo Aula01 - CSS</title>

    <style>
        h4.centralizado {
            text-align: center;
            font-size: 120px;
            color: red;
        }

        * {
            font-family: monospace;
        }
    </style>

</head>
<body>
    
    <h1>Introdução ao CSS</h1>

    <h3 style="font-family: monospace; background-color: crimson;">Exemplo simples de CSS</h3>

    <p style="font-family: monospace; background-color: darkred;">Eu sou um parágrafo</p>

    <hr>

    <h3>Exemplo de um elemento que faz parte de uma classe</h3>

    <h4 class="centralizado">eu sou um h4</h4>

    <p class="centralizado">eu sou um parágrafo</p>

    <hr>

    <h3>Definindo estilos com o seletor global *</h3>

    <p>Todos os elementos visuais terão o mesmo estilo inclusive esse texto.</p>

</body>
</html>
